<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Model Thumbnail Renderer</title>
  <style>
    body { margin: 0; background: #FAF8F5; overflow: hidden; }
    canvas { width: 800px; height: 800px; }
    #status { position: fixed; top: 10px; left: 10px; font-family: sans-serif; background: rgba(0,0,0,0.8); color: white; padding: 8px 12px; border-radius: 4px; }
  </style>
</head>
<body>
  <div id="status">Starting render...</div>
  <canvas id="c" width="800" height="800"></canvas>

  <script type="importmap">
    {
      "imports": {
        "three": "/node_modules/three/build/three.module.js",
        "three/addons/": "/node_modules/three/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    const models = [
      { id: 'sofa-1', file: '/public/furniture/sofa1.glb', name: 'sofa-1.webp' },
      { id: 'sofa-2', file: '/public/furniture/sofa2.glb', name: 'sofa-2.webp' },
      { id: 'sofa-3', file: '/public/furniture/sofa3.glb', name: 'sofa-3.webp' },
      { id: 'sofa-4', file: '/public/furniture/sofa4.glb', name: 'sofa-4.webp' },
      { id: 'chair-1', file: '/public/furniture/chair1.glb', name: 'chair-1.webp' },
      { id: 'chair-2', file: '/public/furniture/chair2.glb', name: 'chair-2.webp' },
      { id: 'chair-3', file: '/public/furniture/chair3.glb', name: 'chair-3.webp' },
      { id: 'chair-4', file: '/public/furniture/chair4.glb', name: 'chair-4.webp' },
      { id: 'dining-table-1', file: '/public/furniture/dining_tabel.glb', name: 'dining-table-1.webp' },
      { id: 'cabinet-1', file: '/public/furniture/Cabin.glb', name: 'cabinet-1.webp' }
    ];

    const canvas = document.getElementById('c');
    const status = document.getElementById('status');

    const renderer = new THREE.WebGLRenderer({
      canvas,
      antialias: true,
      alpha: true,
      preserveDrawingBuffer: true
    });
    renderer.setSize(800, 800);
    renderer.setPixelRatio(1);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#FAF8F5');

    // Soft Studio Lighting
    const amb = new THREE.AmbientLight(0xffffff, 1.2);
    scene.add(amb);

    const dir1 = new THREE.DirectionalLight(0xfff8ee, 1.8);
    dir1.position.set(6, 10, 8);
    dir1.castShadow = true;
    scene.add(dir1);

    const dir2 = new THREE.DirectionalLight(0xebefff, 0.7);
    dir2.position.set(-6, 5, -6);
    scene.add(dir2);

    const dir3 = new THREE.DirectionalLight(0xffffff, 0.4);
    dir3.position.set(0, -3, 6);
    scene.add(dir3);

    const camera = new THREE.PerspectiveCamera(36, 1, 0.1, 100);

    const loader = new GLTFLoader();

    async function renderModel(item) {
      status.innerText = `Rendering ${item.name}...`;

      // Clear previous model
      const oldModel = scene.getObjectByName('currentModel');
      if (oldModel) scene.remove(oldModel);

      return new Promise((resolve, reject) => {
        loader.load(
          item.file,
          (gltf) => {
            const model = gltf.scene;
            model.name = 'currentModel';

            // Calculate Bounding Box
            const box = new THREE.Box3().setFromObject(model);
            const size = new THREE.Vector3();
            box.getSize(size);
            const center = new THREE.Vector3();
            box.getCenter(center);

            // Center model at ground (y = 0)
            model.position.x = -center.x;
            model.position.y = -box.min.y;
            model.position.z = -center.z;

            scene.add(model);

            const maxDim = Math.max(size.x, size.y, size.z);
            const dist = maxDim * 1.85;

            // Camera angle (front 3/4 high angle like Artha catalog)
            camera.position.set(dist * 0.72, size.y * 0.65 + dist * 0.45, dist * 0.85);
            camera.lookAt(0, size.y * 0.48, 0);
            camera.updateProjectionMatrix();

            // Render
            renderer.render(scene, camera);

            // Export image
            const dataUrl = canvas.toDataURL('image/webp', 0.94);

            fetch('/save', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ filename: item.name, dataUrl })
            }).then(() => {
              resolve();
            }).catch(reject);
          },
          undefined,
          reject
        );
      });
    }

    async function runAll() {
      for (const item of models) {
        try {
          await renderModel(item);
          await new Promise(r => setTimeout(r, 200));
        } catch (e) {
          console.error('Failed to render:', item.file, e);
        }
      }
      status.innerText = 'All finished!';
    }

    setTimeout(runAll, 500);
  </script>
</body>
</html>
